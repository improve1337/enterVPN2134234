<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>EnterVPN — Avatars (iOS 18 Dark + Brand Lockup)</title>
<style>
  @font-face {
    font-family: "Inter";
    src: url("fonts/InterVariable.woff2") format("woff2");
    font-weight: 100 900;
    font-display: block;
  }

  :root {
    --bg: #04060b;
    --ink: #f2f5f9;
    --muted: #9aa6b8;
    --faint: #5e6a7d;
    --accent: #00efa5;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); }

  #stage {
    position: relative;
    width: 1024px;
    height: 1024px;
    overflow: hidden;
    background: var(--bg);
    font-family: "Inter", "Segoe UI", sans-serif;
    font-feature-settings: "cv11", "ss03";
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Фон: мягкий меш iOS 18 ---------- */
  .bg { position: absolute; inset: 0; }
  .blob { position: absolute; border-radius: 50%; filter: blur(115px); }
  .b1 { width: 760px; height: 660px; left: -200px; top: 380px; background: #0c3a47; opacity: .66; }
  .b2 { width: 720px; height: 620px; right: -190px; top: -180px; background: #262c63; opacity: .58; }
  .b3 { width: 600px; height: 600px; left: 212px; top: 180px; background: #1a2232; opacity: .82; }
  .b4 { width: 420px; height: 240px; left: 302px; top: 760px; background: #00efa5; opacity: .06; }

  .vignette {
    position: absolute; inset: 0;
    background:
      radial-gradient(72% 72% at 50% 48%, transparent 50%, rgba(2, 4, 9, .68) 100%),
      linear-gradient(180deg, rgba(255, 255, 255, .03) 0%, transparent 32%);
  }

  /* Тонкое стеклянное кольцо внутри круга Telegram */
  .ring-guide {
    position: absolute;
    left: 64px;
    top: 64px;
    width: 896px;
    height: 896px;
    border-radius: 50%;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08), inset 0 0 0 1px rgba(255, 255, 255, .04);
    pointer-events: none;
  }

  /* ---------- Вертикальный брендовый лок-ап в центре круга ---------- */
  .lockup {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-top: 8px;
  }

  .tile {
    position: relative;
    width: 396px;
    height: 396px;
    border-radius: 104px;
    background: linear-gradient(160deg, #2b313c 0%, #161a21 55%, #0d1015 100%);
    box-shadow:
      inset 0 2px 1px rgba(255, 255, 255, .24),
      inset 0 -2px 4px rgba(0, 0, 0, .55),
      inset 0 0 0 1.5px rgba(255, 255, 255, .08),
      0 36px 72px -18px rgba(0, 0, 0, .86),
      0 12px 24px -8px rgba(0, 0, 0, .65);
    display: grid;
    place-items: center;
    overflow: hidden;
  }

  .tile::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(90% 65% at 28% 12%, rgba(255, 255, 255, .1) 0%, transparent 62%);
    pointer-events: none;
  }

  .glyph {
    width: 276px;
    height: 276px;
    display: block;
    filter: drop-shadow(0 14px 20px rgba(0, 0, 0, .55));
  }

  .brand {
    margin-top: 40px;
    font-size: 92px;
    line-height: 1;
    letter-spacing: -0.045em;
    display: flex;
    align-items: baseline;
  }
  .brand .enter {
    font-weight: 800;
    background: linear-gradient(180deg, #ffffff 25%, #cfd8e6 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .brand .vpn {
    font-weight: 600;
    color: #94a2b8;
    margin-left: 2px;
  }

  .pill {
    margin-top: 24px;
    height: 50px;
    padding: 0 26px 0 22px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .065);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .14),
      inset 0 0 0 1px rgba(255, 255, 255, .06),
      0 12px 24px -8px rgba(0, 0, 0, .5);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .pill .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
  }
  .pill span {
    font-size: 21px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #b8c4d6;
  }
</style>
</head>
<body>
<div id="stage">
  <div class="bg">
    <div class="blob b3"></div>
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b4"></div>
    <div class="vignette"></div>
  </div>
  <div class="ring-guide"></div>
  <div class="lockup" id="root"></div>
</div>

<script>
const DEFS = `
  <defs>
    <linearGradient id="shieldBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="48%" stop-color="#DCE3EE"/>
      <stop offset="100%" stop-color="#9CA8BA"/>
    </linearGradient>
    <linearGradient id="shieldRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#94A1B5" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="innerWell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#19202B"/>
      <stop offset="100%" stop-color="#0E131B"/>
    </linearGradient>
    <linearGradient id="headsetGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#B0BCCB"/>
    </linearGradient>
  </defs>
`;

const SHIELD_OUTER = `
  M 184 30
  C 194 25.5 206 25.5 216 30
  L 326 78
  C 340 84 349 97.5 349 113
  L 349 198
  C 349 284 290 347 213 375
  C 204.5 378 195.5 378 187 375
  C 110 347 51 284 51 198
  L 51 113
  C 51 97.5 60 84 74 78
  Z
`;

const SHIELD_WELL = `
  M 190 68
  C 196.5 65 203.5 65 210 68
  L 298 106.5
  C 307 110.5 313 119.5 313 129.5
  L 313 196
  C 313 263 267 313 208 336
  C 203 338 197 338 192 336
  C 133 313 87 263 87 196
  L 87 129.5
  C 87 119.5 93 110.5 102 106.5
  Z
`;

const SHIELD_CHECK_SVG = `
  <svg class="glyph" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
    ${DEFS}
    <path d="${SHIELD_OUTER}" fill="url(#shieldBody)" stroke="url(#shieldRim)" stroke-width="2.5"/>
    <path d="${SHIELD_WELL}" fill="url(#innerWell)" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2"/>
    <path d="M 150 203 L 185 238 L 254 166"
          fill="none"
          stroke="#00EFA5"
          stroke-width="28"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </svg>
`;

const SHIELD_SUPPORT_SVG = `
  <svg class="glyph" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
    ${DEFS}
    <path d="${SHIELD_OUTER}" fill="url(#shieldBody)" stroke="url(#shieldRim)" stroke-width="2.5"/>
    <path d="${SHIELD_WELL}" fill="url(#innerWell)" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2"/>
    <path d="M 138 206 V 184 C 138 148 165.5 121 200 121 C 234.5 121 262 148 262 184 V 206"
          fill="none"
          stroke="url(#headsetGrad)"
          stroke-width="21"
          stroke-linecap="round"/>
    <rect x="122" y="182" width="32" height="58" rx="16" fill="url(#headsetGrad)"/>
    <rect x="246" y="182" width="32" height="58" rx="16" fill="url(#headsetGrad)"/>
    <path d="M 262 232 C 262 258 238 272 204 272"
          fill="none"
          stroke="#9CA8BA"
          stroke-width="15"
          stroke-linecap="round"/>
    <circle cx="196" cy="272" r="14" fill="#00EFA5"/>
  </svg>
`;

const VARIANTS = {
  main: `
    <div class="tile">${SHIELD_CHECK_SVG}</div>
    <div class="brand"><span class="enter">Enter</span><span class="vpn">VPN</span></div>
    <div class="pill"><div class="dot"></div><span>VLESS · Reality</span></div>
  `,
  support: `
    <div class="tile">${SHIELD_SUPPORT_SVG}</div>
    <div class="brand"><span class="enter">Enter</span><span class="vpn">VPN</span></div>
    <div class="pill"><div class="dot"></div><span>Поддержка · 24/7</span></div>
  `,
};

const params = new URLSearchParams(location.search);
const variant = params.get("variant") || "main";
document.getElementById("root").innerHTML = VARIANTS[variant] || VARIANTS.main;
</script>
</body>
</html>
